version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      compatible-gradle-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major Android/Kotlin/Gradle upgrades require an intentional compatibility
      # migration; Dependabot continues to group safe minor and patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, github-actions]
    cooldown:
      default-days: 7
    groups:
      action-updates:
        applies-to: version-updates
        patterns: ["*"]
