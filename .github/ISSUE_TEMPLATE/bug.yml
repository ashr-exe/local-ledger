name: Bug report
description: Report reproducible incorrect behavior using synthetic data only.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Do not paste real SMS messages, balances, account fragments, reference numbers, phone numbers, or other personal data."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 14, emulator or device model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use invented and fully sanitized examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all real financial and personal data.
          required: true
